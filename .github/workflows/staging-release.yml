name: Staging release

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: 'Commit penuh yang sudah selesai dipublikasikan oleh hPanel Git ke staging'
        required: true
        type: string
      rehearse_media:
        description: 'Jalankan cutover sementara R2 dan rollback otomatis setelah release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qammaris-staging-release
  cancel-in-progress: false

jobs:
  release:
    name: Upload assets and finalize Laravel staging release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout expected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_revision }}

      - name: Verify requested revision
        run: test "$(git rev-parse HEAD)" = "${{ inputs.expected_revision }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json
          tar -C public -czf staging-build.tar.gz build

      - name: Prepare protected R2 environment fragment
        if: ${{ inputs.rehearse_media }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_REGION: ${{ vars.R2_REGION }}
          R2_URL: ${{ vars.R2_URL }}
          PRODUCT_MEDIA_TARGET_DISK: ${{ vars.PRODUCT_MEDIA_TARGET_DISK }}
        run: |
          umask 077
          python3 <<'PY' > staging-r2.env
          import json
          import os

          keys = [
              "R2_ACCESS_KEY_ID",
              "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET",
              "R2_ENDPOINT",
              "R2_REGION",
              "R2_URL",
              "PRODUCT_MEDIA_TARGET_DISK",
          ]

          for key in keys:
              value = os.environ.get(key, "")
              if not value:
                  raise SystemExit(f"Missing required staging environment value: {key}")
              print(f"{key}={json.dumps(value)}")

          print('PRODUCT_MEDIA_DISK="r2"')
          PY
          chmod 600 staging-r2.env

      - name: Configure constrained SSH access
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify hPanel source deployment revision
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USERNAME: ${{ secrets.STAGING_SSH_USERNAME }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          test -n "$STAGING_PATH"
          remote_revision="$(ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT" "$STAGING_SSH_USERNAME@$STAGING_SSH_HOST" "cd '$STAGING_PATH' && git rev-parse HEAD")"
          test "$remote_revision" = "$EXPECTED_REVISION"

      - name: Upload built asset artifact
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USERNAME: ${{ secrets.STAGING_SSH_USERNAME }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$STAGING_SSH_PORT" staging-build.tar.gz "$STAGING_SSH_USERNAME@$STAGING_SSH_HOST:$STAGING_PATH/public/.staging-build.tar.gz"

      - name: Atomically activate assets and finalize Laravel
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USERNAME: ${{ secrets.STAGING_SSH_USERNAME }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT" "$STAGING_SSH_USERNAME@$STAGING_SSH_HOST" "STAGING_PATH='$STAGING_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$STAGING_PATH"
          php artisan migrate --force --no-interaction
          if [ ! -e public/storage ]; then
            ln -s "$STAGING_PATH/storage/app/public" public/storage
          fi
          rm -rf public/.staging-build
          mkdir -p public/.staging-build
          tar -xzf public/.staging-build.tar.gz -C public/.staging-build
          rm -f public/.staging-build.tar.gz
          release_marker="$(date +%Y%m%d%H%M%S)"
          if [ -d public/build ]; then
            mv public/build "public/build.previous-$release_marker"
          fi
          mv public/.staging-build/build public/build
          rmdir public/.staging-build
          auth_file="$(dirname "$STAGING_PATH")/.htpasswd"
          if [ -f "$auth_file" ] && ! grep -q 'Qammaris Staging Review' .htaccess; then
            auth_config="$(mktemp .htaccess.XXXXXX)"
            {
              printf '%s\n' 'AuthType Basic'
              printf '%s\n' 'AuthName "Qammaris Staging Review"'
              printf 'AuthUserFile %s\n' "$auth_file"
              printf '%s\n\n' 'Require valid-user'
              cat .htaccess
            } > "$auth_config"
            mv "$auth_config" .htaccess
          fi
          php artisan optimize
          test -f public/build/manifest.json
          test -L public/storage
          REMOTE_SCRIPT

      - name: Rehearse R2 cutover and automatic rollback
        if: ${{ inputs.rehearse_media }}
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USERNAME: ${{ secrets.STAGING_SSH_USERNAME }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
        run: |
          scp -i ~/.ssh/id_ed25519 -P "$STAGING_SSH_PORT" staging-r2.env "$STAGING_SSH_USERNAME@$STAGING_SSH_HOST:$STAGING_PATH/.p4-06-r2.env"
          ssh -i ~/.ssh/id_ed25519 -p "$STAGING_SSH_PORT" "$STAGING_SSH_USERNAME@$STAGING_SSH_HOST" "STAGING_PATH='$STAGING_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$STAGING_PATH"

          fragment="$STAGING_PATH/.p4-06-r2.env"
          backup="$STAGING_PATH/storage/app/private/.env.p4-06.backup"
          candidate="$STAGING_PATH/.env.p4-06.candidate"
          original_hash=""

          restore_environment() {
            if [ -f "$backup" ]; then
              cp "$backup" .env
              chmod 600 .env
              rm -f "$backup"
            fi
            rm -f "$fragment" "$candidate"
            php artisan config:clear --no-interaction >/dev/null
            php artisan optimize --no-interaction >/dev/null
          }

          trap restore_environment EXIT
          test -f .env
          test -f "$fragment"
          test ! -e "$backup"
          test "$(stat -c '%a' .env)" = "600"
          chmod 600 "$fragment"
          original_hash="$(sha256sum .env | awk '{print $1}')"
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (config("media.product_disk") !== "public") { fwrite(STDERR, "Staging did not start on the rollback-safe public disk.\n"); exit(1); }'
          install -m 600 .env "$backup"

          grep -vE '^(R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|R2_BUCKET|R2_ENDPOINT|R2_REGION|R2_URL|PRODUCT_MEDIA_TARGET_DISK|PRODUCT_MEDIA_DISK)=' .env > "$candidate" || true
          cat "$fragment" >> "$candidate"
          chmod 600 "$candidate"
          mv "$candidate" .env
          rm -f "$fragment"

          php artisan config:clear --no-interaction >/dev/null
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (config("media.product_disk") !== "r2") { fwrite(STDERR, "R2 cutover configuration was not activated.\n"); exit(1); }'

          before_counts="$(php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo App\Models\Product::query()->count().":".App\Models\ProductImage::query()->count();')"

          php artisan product-media:rehearse-r2 \
            --sample-path=products/b9A7Hqhl1hzuv47VovEM0QUWRIr0TmbFlL2eSWn1.jpg \
            --expected-size=304172 \
            --expected-sha256=74911ab4f1b07d057bfa6c7a864d164ef71abae1d27df6a75229cd903560d1cc \
            --apply \
            --no-interaction

          after_counts="$(php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo App\Models\Product::query()->count().":".App\Models\ProductImage::query()->count();')"
          test "$before_counts" = "$after_counts"
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); $files=Illuminate\Support\Facades\Storage::disk("r2")->files("products"); if (count($files) !== 19) { fwrite(STDERR, "Unexpected R2 product object count after rehearsal.\n"); exit(1); }'

          restore_environment
          trap - EXIT

          restored_hash="$(sha256sum .env | awk '{print $1}')"
          test "$restored_hash" = "$original_hash"
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (config("media.product_disk") !== "public") { fwrite(STDERR, "Staging media disk rollback was not verified.\n"); exit(1); }'
          printf 'Database counts preserved: %s\n' "$after_counts"
          printf '%s\n' 'Staging media disk rollback verified: public'
          REMOTE_SCRIPT
