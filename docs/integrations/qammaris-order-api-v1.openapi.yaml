openapi: 3.1.0
info:
  title: Qammaris Order API (Website ↔ Qammaris App)
  version: 1.0.0-draft.3
  description: |
    PROPOSED draft matching docs/integrations/QAMMARIS_ORDER_API_V1.md r3. Awaiting Qammaris App contract review; not final, not implemented.
    The Website is the source of truth for orders; Qammaris App for employees, expenses and reimbursements.
    The App backend must verify the employee is logged in, active and holds `orders.handle` before signing any request.
    The App has no cron: the Website webhook is the primary notification path and the App reconciles when pages are opened.
servers:
  - url: https://{website}/integrations/qammaris-app/orders/v1
    variables:
      website: { default: example.invalid }
security:
  - qammarisSignature: []
paths:
  /orders:
    get:
      operationId: listOrders
      summary: Incremental order list ordered by (updated_at, id); never includes contact data
      parameters:
        - { name: updated_since, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: lifecycle, in: query, schema: { $ref: '#/components/schemas/Lifecycle' } }
      responses:
        '200':
          description: Page of order summaries
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  next_cursor: { type: [string, 'null'] }
                  has_more: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}:
    get:
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/claims:
    post:
      operationId: claimTask
      summary: Atomic compare-and-set claim; one holder per (order, task)
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationOptionalRevision'
                - type: object
                  required: [task]
                  properties:
                    task: { $ref: '#/components/schemas/Task' }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/claims/{task}:
    delete:
      operationId: releaseClaim
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: task, in: path, required: true, schema: { $ref: '#/components/schemas/Task' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationOptionalRevision'
                - type: object
                  properties:
                    override_reason: { type: [string, 'null'], maxLength: 200, description: "Required when releasing another holder's claim" }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/preparation:
    post:
      operationId: updatePreparation
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationBase'
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, enum: [preparing, packed] }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/courier-requests:
    post:
      operationId: recordCourierRequest
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationBase'
                - type: object
                  required: [provider]
                  properties:
                    provider: { type: string, enum: [maxim, gosend, grab, other] }
                    provider_label: { type: [string, 'null'], maxLength: 40 }
                    reference: { type: [string, 'null'], maxLength: 80 }
                    status: { type: string, enum: [requested, arrived], default: requested }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/jnt:
    post:
      operationId: recordJnt
      summary: pickup_requested, qr_available and picked_up are separate; tracking number never required
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationBase'
                - type: object
                  minProperties: 3
                  properties:
                    status: { type: string, enum: [pickup_requested, qr_available, picked_up] }
                    occurred_at: { type: string, format: date-time }
                    tracking_number: { type: [string, 'null'], maxLength: 40, pattern: '^[A-Za-z0-9-]+$' }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/jnt/qr:
    put:
      operationId: uploadJntQr
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, expected_revision, actor]
              properties:
                file: { type: string, format: binary, description: 'image/png or image/jpeg, max 2 MiB' }
                expected_revision: { type: integer }
                actor: { type: string, description: JSON-encoded Actor }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: getJntQr
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: QR image, content: { image/png: {}, image/jpeg: {} } }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/handover:
    post:
      operationId: recordHandover
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationBase'
                - type: object
                  required: [handed_to]
                  properties:
                    handed_to: { type: string, enum: [courier, customer, customer_courier, jnt] }
                    occurred_at: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/delivery:
    post:
      operationId: confirmDelivery
      summary: Optional delivery confirmation, separate from handover
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationBase'
                - type: object
                  properties:
                    occurred_at: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/issues:
    post:
      operationId: openIssue
      parameters: [{ $ref: '#/components/parameters/OrderId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationOptionalRevision'
                - type: object
                  required: [type, note]
                  properties:
                    type: { type: string, enum: [stock_problem, courier_problem, customer_unreachable, address_problem, payment_problem, other] }
                    note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/issues/{issue_id}/resolve:
    post:
      operationId: resolveIssue
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: issue_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MutationOptionalRevision'
                - type: object
                  properties:
                    note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/costs/{expense_id}:
    put:
      operationId: upsertCost
      summary: Upsert by unique App expense ID; one expense links to one order; stale source_version is a no-op
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: expense_id, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount, paid_by, proof, reimbursement, source_version, actor]
              properties:
                kind: { type: string, enum: [actual_shipping, packaging, other] }
                amount: { type: integer, minimum: 0, maximum: 100000000 }
                paid_by: { type: string, enum: [cashier_cash, owner_transfer, staff_advance, customer_direct] }
                proof: { $ref: '#/components/schemas/Proof' }
                reimbursement: { $ref: '#/components/schemas/Reimbursement' }
                source_version: { type: integer, minimum: 1 }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200': { $ref: '#/components/responses/Mutation' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    qammarisSignature:
      type: apiKey
      in: header
      name: X-Qammaris-Signature
      description: HMAC-SHA256 over timestamp, method, path+query and body hash; see contract §3.
  parameters:
    OrderId: { name: id, in: path, required: true, schema: { type: string, description: ULID } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' } }
  responses:
    Mutation:
      description: Applied (or idempotent replay)
      content:
        application/json:
          schema:
            type: object
            required: [order, event_id]
            properties:
              order: { $ref: '#/components/schemas/Order' }
              event_id: { type: [string, 'null'] }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Actor:
      type: object
      required: [app_user_id, display_name, permission]
      properties:
        app_user_id: { type: string, maxLength: 64, description: 'Stable, never reused App employee ID' }
        display_name: { type: string, maxLength: 60 }
        app_role: { type: [string, 'null'], maxLength: 30 }
        permission: { type: string, const: orders.handle, description: 'Asserted by the App backend after its own authorization' }
    ActorRef:
      type: object
      properties:
        app_user_id: { type: string }
        display_name: { type: string }
    MutationBase:
      type: object
      required: [expected_revision, actor]
      properties:
        expected_revision: { type: integer, minimum: 1 }
        actor: { $ref: '#/components/schemas/Actor' }
    MutationOptionalRevision:
      type: object
      required: [actor]
      properties:
        expected_revision: { type: [integer, 'null'], minimum: 1 }
        actor: { $ref: '#/components/schemas/Actor' }
    Task: { type: string, enum: [preparation, courier_booking, handover] }
    Lifecycle: { type: string, enum: [draft, awaiting_customer, active, completed, cancelled] }
    Money: { type: integer, description: Whole rupiah }
    Proof:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, attached, waived] }
        attached_at: { type: [string, 'null'], format: date-time }
    Reimbursement:
      type: object
      required: [status]
      description: approved/paid require proof.status=attached, or proof.status=waived with proof_exception (Owner rule)
      properties:
        status: { type: string, enum: [not_applicable, submitted, approved, paid, rejected] }
        updated_at: { type: string, format: date-time }
        approved_by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
        proof_exception:
          type: [object, 'null']
          properties:
            approved_by: { $ref: '#/components/schemas/ActorRef' }
            reason: { type: string, maxLength: 200 }
            at: { type: string, format: date-time }
    Claim:
      type: [object, 'null']
      properties:
        holder: { $ref: '#/components/schemas/ActorRef' }
        claimed_at: { type: string, format: date-time }
    OrderSummary:
      type: object
      required: [id, number, revision, updated_at, lifecycle]
      properties:
        id: { type: string }
        number: { type: string }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        source: { type: string, enum: [whatsapp, instagram, website, manual] }
        fulfillment_type: { type: [string, 'null'], enum: [pickup, local_delivery, intercity, null] }
        area: { type: [string, 'null'], enum: [pickup, palu, luar_kota, null] }
        recipient_display: { type: [string, 'null'], description: 'First name + initial only' }
        item_count: { type: integer }
        payment_status: { type: string, enum: [unpaid, paid, refund_pending, refunded] }
        preparation_status: { type: string, enum: [not_started, preparing, packed] }
        handover_status: { type: string, enum: [pending, handed_over] }
        jnt_status: { type: [string, 'null'], enum: [not_requested, pickup_requested, qr_available, picked_up, null] }
        claims:
          type: object
          properties:
            preparation: { $ref: '#/components/schemas/Claim' }
            courier_booking: { $ref: '#/components/schemas/Claim' }
            handover: { $ref: '#/components/schemas/Claim' }
    Order:
      type: object
      required: [id, number, revision, created_at, updated_at, source, lifecycle, currency, items, packaging, totals, payment, fulfillment, claims, obligations, costs, issues]
      properties:
        id: { type: string }
        number: { type: string, example: QAM-0012 }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source: { type: string, enum: [whatsapp, instagram, website, manual] }
        lifecycle: { $ref: '#/components/schemas/Lifecycle' }
        currency: { type: string, const: IDR }
        items:
          type: array
          items:
            type: object
            required: [line_id, product_id, variant_id, name, unit_price, quantity, line_total]
            properties:
              line_id: { type: string }
              product_id: { type: integer }
              variant_id: { type: integer }
              brand: { type: [string, 'null'] }
              name: { type: string }
              volume_ml: { type: [integer, 'null'] }
              unit_price: { $ref: '#/components/schemas/Money' }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              line_total: { $ref: '#/components/schemas/Money' }
        packaging: { type: [string, 'null'], enum: [paperbag, no_paperbag, null] }
        totals:
          type: object
          required: [subtotal, adjustments, shipping_charge, total]
          properties:
            subtotal: { $ref: '#/components/schemas/Money' }
            adjustments: { type: integer }
            shipping_charge: { $ref: '#/components/schemas/Money' }
            total: { $ref: '#/components/schemas/Money' }
        payment:
          type: object
          required: [status, recorded_in_majoo]
          properties:
            status: { type: string, enum: [unpaid, paid, refund_pending, refunded] }
            method: { type: [string, 'null'], enum: [transfer, qris, cash, null] }
            confirmation_source: { type: [string, 'null'], enum: [proof_in_chat, proof_uploaded, majoo, null] }
            confirmed_at: { type: [string, 'null'], format: date-time }
            recorded_in_majoo: { type: boolean }
        fulfillment:
          type: object
          required: [type]
          properties:
            type: { type: [string, 'null'], enum: [pickup, local_delivery, intercity, null] }
            recipient:
              type: [object, 'null']
              description: Task-scoped; null 7 days after the order is closed (contract §6.1)
              properties:
                name: { type: string }
                phone: { type: string }
                address: { type: [string, 'null'] }
                postcode: { type: [string, 'null'] }
                location_url: { type: [string, 'null'] }
            note: { type: [string, 'null'] }
            preparation:
              type: object
              properties:
                status: { type: string, enum: [not_started, preparing, packed] }
                updated_at: { type: [string, 'null'], format: date-time }
            courier:
              type: [object, 'null']
              properties:
                booking_responsibility: { type: string, enum: [store, customer] }
                provider: { type: [string, 'null'], enum: [maxim, gosend, grab, other, null] }
                status: { type: string, enum: [not_needed, unassigned, requested, arrived] }
                reference: { type: [string, 'null'] }
                requested_at: { type: [string, 'null'], format: date-time }
            jnt:
              type: [object, 'null']
              properties:
                status: { type: string, enum: [not_requested, pickup_requested, qr_available, picked_up] }
                pickup_requested_at: { type: [string, 'null'], format: date-time }
                qr_available: { type: boolean }
                qr_url: { type: [string, 'null'] }
                picked_up_at: { type: [string, 'null'], format: date-time }
                tracking_number: { type: [string, 'null'] }
            handover:
              type: object
              properties:
                status: { type: string, enum: [pending, handed_over] }
                handed_to: { type: [string, 'null'], enum: [courier, customer, customer_courier, jnt, null] }
                handed_over_at: { type: [string, 'null'], format: date-time }
            delivery:
              type: object
              properties:
                status: { type: string, enum: [unconfirmed, delivered] }
                delivered_at: { type: [string, 'null'], format: date-time }
                confirmed_by: { type: [string, 'null'], enum: [customer, website, app, null] }
        claims:
          type: object
          properties:
            preparation: { $ref: '#/components/schemas/Claim' }
            courier_booking: { $ref: '#/components/schemas/Claim' }
            handover: { $ref: '#/components/schemas/Claim' }
        obligations:
          type: array
          items:
            type: object
            required: [type, status]
            properties:
              type: { type: string, enum: [refund, reimbursement] }
              status: { type: string, enum: [open, settled] }
              amount: { $ref: '#/components/schemas/Money' }
              ref: { type: [string, 'null'] }
        costs:
          type: array
          items:
            type: object
            properties:
              expense_id: { type: string }
              kind: { type: string, enum: [actual_shipping, packaging, other] }
              amount: { $ref: '#/components/schemas/Money' }
              paid_by: { type: string, enum: [cashier_cash, owner_transfer, staff_advance, customer_direct] }
              proof: { $ref: '#/components/schemas/Proof' }
              reimbursement: { $ref: '#/components/schemas/Reimbursement' }
              reported_by: { $ref: '#/components/schemas/ActorRef' }
              reported_at: { type: string, format: date-time }
              source_version: { type: integer }
        issues:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              status: { type: string, enum: [open, resolved] }
              note: { type: string }
              opened_by: { $ref: '#/components/schemas/ActorRef' }
              opened_at: { type: string, format: date-time }
              resolved_at: { type: [string, 'null'], format: date-time }
        keep:
          type: [object, 'null']
          properties:
            status: { type: string, enum: [active, converted, expired, released] }
            until: { type: string, format: date-time }
            stock_set_aside:
              type: object
              properties:
                confirmed: { type: boolean }
                by: { oneOf: [{ $ref: '#/components/schemas/ActorRef' }, { type: 'null' }] }
                at: { type: [string, 'null'], format: date-time }
        links:
          type: object
          properties:
            app_task: { type: string, description: 'App deep link; contains only the public order ID' }
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, invalid_signature, stale_timestamp, unknown_client, action_not_allowed, order_not_found,
                     revision_conflict, invalid_transition, task_already_claimed, expense_already_linked, idempotency_key_reused,
                     payload_too_large, validation_failed, proof_required, rate_limited, server_error, unavailable]
            message: { type: string }
            details: { type: object }
        request_id: { type: string }
